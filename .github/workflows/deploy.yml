name: Deploy to serverkitlabs

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy to server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/deploy_key iishanto@$SSH_HOST << 'EOF'
            set -e
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            echo "Deploying ServerKit Labs..."
            cd ~/docker-vps || mkdir -p ~/docker-vps && cd ~/docker-vps

            # Initialize git repo if not already
            if [ ! -d .git ]; then
              git init
              git remote add origin https://github.com/me-sharif-hasan/docker-vps.git
            fi

            # Fetch latest code
            git fetch origin main
            git checkout -f origin/main

            # Install/update dependencies
            npm install --production

            # Load environment config for the app
            set -a
            [ -f .env ] && . .env
            set +a

            # Restart the service
            if pm2 list | grep -q "serverkit-labs"; then
              pm2 restart serverkit-labs --update-env
              echo "Service restarted successfully"
            else
              pm2 start server.js --name serverkit-labs
              echo "Service started successfully"
            fi

            echo "Deployment completed!"
          EOF
